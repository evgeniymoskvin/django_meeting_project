{% load meeting_tags %}
<!DOCTYPE html>
<html lang="ru-RU">
<head>
    {% load static %}
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>
        {% block title %}
            Title
        {% endblock %}
    </title>

    {#    <link rel="icon" type="image/x-icon" href="{% static 'vacation_frontend/favicon/favicon.png' %}"#}
    {#          sizes="any">#}

    <link rel="stylesheet" type="text/css"
          href="{% static 'meeting_frontend/DataTables/datatables.css' %}"/>
    <link rel="stylesheet" type="text/css"
          href="{% static 'meeting_frontend/Bootstrap-5-5.1.3/css/bootstrap.min.css' %}"/>
    <link rel="stylesheet" type="text/css" href="{% static 'meeting_frontend/css/page_calculator.css' %}"/>
    <link rel="stylesheet" type="text/css" href="{% static 'meeting_frontend/css/scroll-panel.css' %}"/>
    <link rel="stylesheet" type="text/css" href="{% static 'meeting_frontend/css/loader-big.css' %}"/>
    <link rel="stylesheet" type="text/css" href="{% static 'meeting_frontend/css/style_sidebar.css' %}"/>
    <link rel="stylesheet" media="print" href="{% static 'meeting_frontend/css/print.css' %}"/>
    <link rel="stylesheet" type="text/css" href="{% static 'meeting_frontend/select2/select2.min.css' %}"/>
    {% block css_script %}
    {% endblock %}

    {#    <script type="text/javascript" src="{% static 'vacation_frontend/jQuery-3.6.0/jquery-3.6.0.min.js' %}"></script>#}
    <script type="text/javascript" src="{% static 'meeting_frontend/jQuery-3.6.0/jquery-3.6.0.min.js' %}"></script>
    <script type="text/javascript"
            src="{% static 'meeting_frontend/Bootstrap-5-5.1.3/js/bootstrap.bundle.js' %}"></script>

    <script type="text/javascript" src="{% static 'meeting_frontend/select2/select2.min.js' %}"></script>

    {% block js_stuff  %}
    {% endblock %}

</head>


<body class="content-fade">

{% include "meeting_frontend/sidebar.html" %}

<a href="#" id="scroll_top">
    <div style="display: flex; flex-direction: row; align-items: center">
        <div class="up-icon"></div>
        <span>Наверх</span>
    </div>
</a>
<div class="d-flex flex-column w-100">
    <div id="all_content" class="d-flex container back-search">
        {% block content %}
        {% endblock %}
    </div>
</div>

<div id="loader" class="min-vh-100 w-100 align-items-center justify-content-center d-none flex-column">
    <span class="loader-big d-flex"></span>
    <div class="d-flex align-items-center"></div>
</div>

<!-- Модальное окно ошибки-->
<div class="modal fade" id="error_modal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered modal-dialog_clearance">
        <div class="modal-content modal-content_clearance">
            <div class="modal-header modal-header_clearance">
                <h5 class="modal-title text-24px-regular" style="cursor: context-menu">Ошибка</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"
                        aria-label="Close"></button>
            </div>

            <div class="modal-body modal-body_clearance">
                <div class="d-flex w-100 justify-content-between align-items-center">
                    <div class="d-flex text-20px-light">Что-то пошло не так...</div>
                </div>
            </div>
            <div class="modal-footer modal-footer_clearance justify-content-center">

                <button class="button_blue_clearance"
                        onclick="$('#error_modal').modal('hide');">
                    Очень жаль
                </button>
            </div>
        </div>
    </div>
</div>

</body>


<script>
    // Открытие модальных поверх друг друга
    const adjustModalZIndex = () => {
        const modals = document.querySelectorAll('.modal.show');
        const modalCount = modals.length;

        modals.forEach((modal, index) => {
            const baseZIndex = 1040;
            modal.style.zIndex = baseZIndex + (index * 2) + 1;
            console.log('index', index)
        });

        const backdrops = document.querySelectorAll('.modal-backdrop');
        backdrops.forEach((backdrop, index) => {
            const baseZIndex = 1040;
            backdrop.style.zIndex = baseZIndex + (index * 2);
        });
    };

    document.addEventListener('shown.bs.modal', adjustModalZIndex);
    document.addEventListener('hidden.bs.modal', adjustModalZIndex);

    // подключение переноса модальных окон

    // боковая кнопка прокрутки наверх
    $(function () {
        $(window).scroll(function () {
            if ($(window).scrollTop() > 300) {
                $('#scroll_top').show()
                $('#scroll_top').css('display', 'flex');
            } else {
                $('#scroll_top').hide();
            }
        });

        $('#scroll_top').click(function () {
            $('html, body').animate({scrollTop: 0}, 600);
            return false;
        });
    });


    $(document).ready(function () {
        if (document.referrer != "") {
            $('#back_button').removeClass('d-none')
            $('#back_button').addClass('d-flex')
        }
    });
</script>

</html>
